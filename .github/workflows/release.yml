name: Release

# Pushing a version tag (v0.1.0, v0.2.0, ...) builds the app and publishes it as a
# GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app/Cargo.toml version $version"
          }

      # The icons, sensor tables and English strings come from the original app and are
      # not stored in this repository. A zip of them is downloaded from the address in
      # the ASSETS_URL repository secret; re/scripts/extract_assets.py produces its
      # contents from an installed copy of the original.
      - name: Fetch resources
        shell: pwsh
        env:
          ASSETS_URL: ${{ secrets.ASSETS_URL }}
        run: |
          if (-not $env:ASSETS_URL) { throw 'The ASSETS_URL repository secret is not set' }
          Invoke-WebRequest $env:ASSETS_URL -OutFile assets.zip
          $hash = (Get-FileHash assets.zip -Algorithm SHA256).Hash
          if ($hash -ne 'EA3BD85436132CEB2E8111C5A5665554860367A390E3F84DDAE53B1E21598A85') { throw "assets.zip has an unexpected SHA-256: $hash" }
          Expand-Archive assets.zip -DestinationPath app/assets

      # The AppleSMC kernel driver is also the original app's (CrystalBit Solutions).
      # It is fetched from DRIVER_URL, pinned by hash and checked for a valid signature.
      - name: Fetch driver
        shell: pwsh
        env:
          DRIVER_URL: ${{ secrets.DRIVER_URL }}
        run: |
          if (-not $env:DRIVER_URL) { throw 'The DRIVER_URL repository secret is not set' }
          Invoke-WebRequest $env:DRIVER_URL -OutFile applesmc.sys
          $hash = (Get-FileHash applesmc.sys -Algorithm SHA256).Hash
          if ($hash -ne '2E35DF03B80EF6FC6DA53C44A3C9454C945F4822C8F1F3355EEA2D1E06E53FD5') { throw "applesmc.sys has an unexpected SHA-256: $hash" }
          $signature = Get-AuthenticodeSignature applesmc.sys
          if ($signature.Status -ne 'Valid') { throw "applesmc.sys signature is $($signature.Status)" }

      - name: Test
        run: cargo test --manifest-path app/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/target/release/rusty-macs-fan-control.exe dist/RustyMacsFanControl.exe
          Copy-Item applesmc.sys dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "RustyMacsFanControl-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: RustyMacsFanControl-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
