name: Release

# Pushing a version tag (v0.1.0, v0.2.0, ...) builds the app and publishes it as a
# GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app/Cargo.toml version $version"
          }

      # The icons, sensor tables and English strings come from the original app and are
      # not stored in this repository, so they are taken from its official installer.
      - name: Extract resources from the original app
        shell: pwsh
        run: |
          Invoke-WebRequest https://crystalidea.com/downloads/macsfancontrol_setup.exe -OutFile setup.exe
          $target = Join-Path $PWD original
          $setup = Start-Process ./setup.exe -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$PWD\install.log`"", "/DIR=`"$target`""
          # The installer does not return on a build machine (after copying its files it
          # starts the app, which has no Mac to talk to). Only the unpacked executable is
          # needed, so continue once that file is complete and end whatever is left.
          $exe = Join-Path $target MacsFanControl.exe
          $deadline = (Get-Date).AddMinutes(4)
          $lastSize = -1
          while ($true) {
            Start-Sleep -Seconds 5
            $size = if (Test-Path $exe) { (Get-Item $exe).Length } else { -1 }
            if ($size -gt 0 -and $size -eq $lastSize) { break }
            $lastSize = $size
            if ($setup.HasExited -and $size -le 0) { break }
            if ((Get-Date) -gt $deadline) { break }
          }
          Get-Process MacsFanControl, AppleSMC -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process | Where-Object { $_.Path -like "$env:TEMP\is-*" -or $_.Id -eq $setup.Id } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $exe)) {
            Write-Host '--- installer log'
            if (Test-Path install.log) { Get-Content install.log -Tail 60 }
            Write-Host '--- processes with windows'
            Get-Process | Where-Object MainWindowTitle | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String | Write-Host
            throw 'The installer did not unpack MacsFanControl.exe'
          }
          python -I re/scripts/extract_assets.py $target app/assets

      - name: Test
        run: cargo test --manifest-path app/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path app/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/target/release/rusty-macs-fan-control.exe dist/RustyMacsFanControl.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "RustyMacsFanControl-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: RustyMacsFanControl-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
